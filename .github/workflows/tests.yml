name: Tests
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint PHP
        run: find src tests config bin -type f \( -name '*.php' -o -name 'build-assets' \) -print0 | xargs -0 -n1 php -l
      - name: Run PHPUnit
        run: vendor/bin/phpunit
